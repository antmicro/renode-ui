image: node:24-bookworm

stages:
  - build
  - test
  - export-neutralino
  - docs

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  FRONTEND_BASE_PATH: frontend/
  SCALENODE_DISK: 8

# Triggered for master pushes, schedules etc. and on MR creation or modification
.only_master_and_all_mrs: &only_master_and_all_mrs
  only:
    variables:
    - $CI_COMMIT_REF_NAME == "master"
    - $CI_PIPELINE_SOURCE == "merge_request"

.test_template:
  stage: test
  <<: *only_master_and_all_mrs

  variables:
    SCALENODE_RAM: 6114

  before_script:
    - apt update -qq > /dev/null 2>&1
    - apt install -y -qq tar > /dev/null 2>&1
    - ./scripts/install_renode.sh
    - npm ci --prefix="$FRONTEND_BASE_PATH"

  after_script:
    - mv "$FRONTEND_BASE_PATH/playwright-report" "$REPORT_PATH"
    - ./scripts/patch_trace_viewer.sh "$REPORT_PATH"

  artifacts:
    when: always
    paths:
      - "$FRONTEND_BASE_PATH/test-results/"
      - "$REPORT_PATH"
    expire_in: 1 week

build:
  stage: build
  <<: *only_master_and_all_mrs
  script:
    - cd $FRONTEND_BASE_PATH
    - npm ci
    - npm run format:check
    - npm run build:web
    - npm run build:lib

  artifacts:
    paths:
      - "$FRONTEND_BASE_PATH/build/*"
      - "$FRONTEND_BASE_PATH/dist/*"
    expire_in: 1 week

test_chromium:
  extends: .test_template
  variables:
    REPORT_PATH: playwright-report-chromium
  script:
    - npm run test:ci:chrome --prefix="$FRONTEND_BASE_PATH"

test_old_chromium:
  extends: .test_template
  variables:
    REPORT_PATH: playwright-report-old-chromium
  script:
    # Forcefully override version to use Chromium 116.0.5845.82 (August 8th 2023)
    - npm i playwright@1.37
    - npm run test:ci:chrome --prefix="$FRONTEND_BASE_PATH"

test_firefox:
  extends: .test_template
  variables:
    REPORT_PATH: playwright-report-firefox
  script:
    - npm run test:ci:firefox --prefix="$FRONTEND_BASE_PATH"

test_old_firefox:
  extends: .test_template
  variables:
    REPORT_PATH: playwright-report-old-firefox
  script:
    # Forcefully override version to use Firefox 115.0 (July 4th 2023)
    - npm i playwright@1.37
    - npm run test:ci:firefox --prefix="$FRONTEND_BASE_PATH"

package-neutralino:
  stage: export-neutralino
  <<: *only_master_and_all_mrs

  variables:
    SCALENODE_RAM: 8192
    SCALENODE_FEATURES: "!hetzner"

  before_script:
  - apt update -qq > /dev/null 2>&1
  - apt install -y -qq libarchive-tools rpm xz-utils unzip > /dev/null 2>&1

  script:
    - ./scripts/build_neutralino.sh
    - mkdir release
    - cd release
    - unzip ../neutralino/dist/renode-ui-*.zip
    - rm resources.neu
    - chmod +x renode-ui*
    - tar -czf renode-ui.tar.gz renode-ui*
    - rm renode-ui-*

  artifacts:
    paths:
      - release

package-neutralino-debug:
  stage: export-neutralino
  <<: *only_master_and_all_mrs
  extends: package-neutralino
  variables:
    SCALENODE_RAM: 8192
    DEBUG_BUILD: "true"

deploy_docs:
  stage: docs
  <<: *only_master_and_all_mrs
  tags: ['docs']
  image: busybox:latest
  when: always
  dependencies: [build, test_chromium, test_old_chromium, test_firefox, test_old_firefox]
  variables:
    GIT_SUBMODULE_STRATEGY: none
    SCALENODE_FEATURES: "!hetzner"
  script:
    - mkdir docs
    - mv playwright-report-* docs
    - cp scripts/test_results_index.html docs/index.html
    # Static build of this branch; hash routing makes SvelteKit emit absolute /_app/ paths,
    # rewrite them so the app works from the docs sub-folder
    - mv "$FRONTEND_BASE_PATH/build" docs/app
    - sed -i -E 's#"/(_app/|favicon\.svg)#"./\1#g' docs/app/index.html
  after_script:
    - tar cf $CI_DOCS_ARCHIVE -C docs .
  artifacts:
    when: always
    paths:
      - $CI_DOCS_ARCHIVE
